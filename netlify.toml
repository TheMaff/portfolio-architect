[build]
  command = "npm run build"
  publish = "dist/me-pro-portfolio/browser"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

[[headers]]
  for = "/contact-form.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"
